name: Desktop builds and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-2025
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Tests
        run: python tools/ci_tests.py
      - name: Frontend behavior
        shell: bash
        run: |
          for test in docs/frontend-*-test.cjs; do node "$test"; done
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(python -c 'from app_info import VERSION;print(VERSION)')
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Build macOS
        if: runner.os == 'macOS'
        run: tools/build_macos.sh
      - name: Smoke macOS package
        if: runner.os == 'macOS'
        run: |
          python tools/smoke_backend.py release-dist/日常学习.app/Contents/Resources/backend/study-backend
          codesign --verify --deep --strict release-dist/日常学习.app
          hdiutil verify release-dist/*.dmg
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/windows-ci.ps1 build
      - name: Smoke Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/windows-ci.ps1 smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            release-dist/*.zip
            release-dist/*.dmg
            release-dist/*.exe
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish all verified platform builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum *.zip *.dmg *.exe > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --draft --title "Daily Study $GITHUB_REF_NAME" --notes-file ../docs/release-notes.md ./*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
